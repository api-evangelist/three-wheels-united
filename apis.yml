name: Three Wheels United
description: >-
  Three Wheels United is a fintech-driven electric vehicle financing company in
  India, founded in 2017 by Cedrick Tandong, Kevin Wervenbos, and Apurv Mehra.
  It works to remove the financial barriers to clean mobility by providing loans
  for two- and three-wheeler electric vehicles — starting with auto-rickshaws —
  disbursed through its RBI-registered NBFC lending partner Shabri Investments
  Private Limited. The company pairs credit with a mobile app that helps drivers
  manage their loans and connect to services, and reports over 4,000 vehicles
  financed, 20,000+ customers served, and thousands of tonnes of CO2 reduced
  across Bangalore, Mumbai, and the Delhi NCR (Noida) region. It is backed by
  Techstars, Delta Corp Holdings, Asian Development Bank Ventures, Microsoft, and
  other global investors, having raised roughly $10 million in Series A funding.
  It is a consumer-facing lender with no public developer program, API, or SDKs.
